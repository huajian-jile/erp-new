<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WMS 登录</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="mb-3">WMS 登录</h4>

          <div class="small text-secondary mb-3">
            演示账号：<code>admin/admin</code> 或 <code>user/user</code>
          </div>

          <div class="alert alert-warning py-2 mb-3 d-none" id="login-error"></div>

          <form method="post" action="/login">
            <div class="mb-3">
              <label class="form-label small">用户名</label>
              <input class="form-control" name="username" autocomplete="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label small">密码</label>
              <input class="form-control" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">登录</button>
          </form>

          <div class="mt-3 small text-secondary">
            登录后会跳转回首页；退出登录请使用右上角（或 ` /logout `）。
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const url = new URL(window.location.href);
  if (url.searchParams.get('error') === '1') {
    const el = document.getElementById('login-error');
    el.classList.remove('d-none');
    el.textContent = '用户名或密码错误';
  }
</script>
</body>
</html>
